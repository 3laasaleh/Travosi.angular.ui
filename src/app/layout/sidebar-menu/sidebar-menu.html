@if(showSidebar) {
  <aside class="hidden lg:block w-72 shrink-0 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm  dark:bg-slate-900">
    <div class="mb-6">
      <h5 class="text-lg font-semibold text-slate-900 dark:text-white">Admin / Agent Menu</h5>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Quick access to management sections.</p>
    </div>

    <nav aria-label="Admin sections">
      <ul class="space-y-2 text-sm">
        @for (item of menuItems; track item.path) {
          <li [class.active]="activeMenu === item.path">
            <a
              [routerLink]="item.path"
              routerLinkActive="active !border-primary !bg-primary !text-white"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              class="block rounded-2xl border border-gray-100 bg-slate-50 px-4 py-3 text-slate-700 transition hover:border-primary hover:bg-primary hover:text-white"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>
}
