<div [class.w-full]="isMobile" [class.relative]="!isMobile" (mouseenter)="openMenu()" (mouseleave)="scheduleClose()">
  <button
    type="button"
    class="flex w-full items-center justify-between gap-1.5 border-b border-slate-200 px-3 py-2 font-medium text-slate-900 transition hover:bg-slate-50 hover:text-primary lg:w-auto lg:border-0 lg:px-4 lg:py-2.5 lg:text-sm lg:font-semibold lg:text-slate-600 lg:hover:bg-transparent"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen"
    (click)="toggleMenu($event)"
  >
    {{ 'packages' | translate }}
    <i class="mdi text-base leading-none" [class.mdi-chevron-down]="!menuOpen" [class.mdi-chevron-up]="menuOpen"></i>
  </button>

  @if (menuOpen) {
    <div class="z-50 mt-2 w-full rounded-xl border border-slate-200 bg-white p-2 shadow-xl lg:absolute lg:start-0 lg:w-72" (mouseenter)="cancelClose()" (mouseleave)="scheduleClose()" role="menu">
      <div class="max-h-80 overflow-y-auto p-2">
        @if (isLoading) {
          @for (row of [1,2,3,4]; track row) {
            <div class="mx-3 my-2 h-4 animate-pulse rounded-full bg-slate-200"></div>
          }
        } @else {
          @for (item of packages; track item.id ?? item.packageId) {
            <a [routerLink]="item.routeName ? ['/packages', item.routeName] : ['/packages']" (click)="onNavigate()" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary" role="menuitem">
              <i class="mdi mdi-package-variant-closed text-primary"></i>
              {{ packageName(item) }}
            </a>
          } @empty {
            <p class="p-4 text-center text-sm text-slate-500">{{ 'noPackagesFound' | translate }}</p>
          }
        }
      </div>
      <a routerLink="/packages" (click)="onNavigate()" class="mt-1 block border-t border-slate-100 px-3 py-3 text-center text-sm font-semibold text-primary hover:bg-slate-50">{{ 'viewAllPackages' | translate }}</a>
    </div>
  }
</div>
