<div class="relative">
  <button
    type="button"
    class="flex items-center gap-1 rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 hover:text-primary dark:hover:bg-slate-800"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen"
    (click)="toggleMenu($event)"
  >
    {{ 'tours' | translate }}
    <i class="mdi text-base leading-none" [class.mdi-chevron-down]="!menuOpen" [class.mdi-chevron-up]="menuOpen"></i>
  </button>

  @if (menuOpen) {
    <div class="absolute left-0 mt-2 w-64 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg dark:border-slate-700 dark:bg-slate-900" role="menu">
      <div class="max-h-80 overflow-y-auto p-2">
        @if (isLoading) {
          @for (row of [1,2,3,4]; track row) {
            <div class="mx-3 my-2 h-4 animate-pulse rounded-full bg-slate-200"></div>
          }
        } @else {
          @for (item of tours; track item.id) {
            <a routerLink="/tours" (click)="closeMenu()" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary dark:text-slate-300 dark:hover:bg-slate-800" role="menuitem">
              <i class="mdi mdi-compass-outline text-primary"></i>
              {{ item.nameEng ?? item.name }}
            </a>
          } @empty {
            <p class="p-4 text-center text-sm text-slate-500">{{ 'noToursFound' | translate }}</p>
          }
        }
      </div>
      <a routerLink="/tours" (click)="closeMenu()" class="block border-t border-slate-100 px-4 py-3 text-center text-sm font-semibold text-primary hover:bg-slate-50 dark:border-slate-800 dark:hover:bg-slate-800">{{ 'viewAllTours' | translate }}</a>
    </div>
  }
</div>
