<div>
    <div class="fixed top-1/4 -left-2 z-50">
        <span class="relative inline-block rotate-90">
            <input type="checkbox" class="checkbox opacity-0 absolute" id="chk" (change)="changeMode()">
            <label class="label bg-slate-900 dark:bg-white shadow dark:shadow-gray-800 cursor-pointer rounded-full flex justify-between items-center p-1 w-14 h-8" for="chk">
                <i data-feather="moon" class="w-[18px] h-[18px] text-yellow-500"></i>
                <i data-feather="sun" class="w-[18px] h-[18px] text-yellow-500"></i>
                <span class="ball bg-white dark:bg-slate-900 rounded-full absolute top-[2px] left-[2px] w-7 h-7"></span>
            </label>
        </span>
    </div>

    <div class="fixed top-[40%] -left-3 z-50">
        <a href="javascript:void(0)" id="switchRtl">
            <span class="py-1 px-3 relative inline-block rounded-b-md -rotate-90 bg-white dark:bg-slate-900 shadow-md dark:shadow dark:shadow-gray-800 font-semibold rtl:block ltr:hidden" (click)="changeThem($event)">LTR</span>
            <span class="py-1 px-3 relative inline-block rounded-b-md -rotate-90 bg-white dark:bg-slate-900 shadow-md dark:shadow dark:shadow-gray-800 font-semibold ltr:block rtl:hidden" (click)="changeThem($event)">RTL</span>
        </a>
    </div>

    @if (switcherBack) {
        <a (click)="scrollToTop()" [class.flex]="showTopButton" [class.hidden]="!showTopButton" id="back-to-top" class="fixed cursor-pointer text-lg rounded-md z-10 bottom-5 end-5 size-8 text-center bg-primary/10 hover:bg-primary text-primary hover:text-white justify-center items-center"><i class="mdi mdi-arrow-up"></i></a>
    } @else {
        <div class="fixed bottom-3 end-3 z-10">
            <a routerLink="/" class="back-button size-8 inline-flex items-center justify-center tracking-wide align-middle duration-500 text-base text-center bg-primary/10 hover:bg-primary text-primary hover:text-white rounded-md"><i data-feather="arrow-left" class="size-4"></i></a>
        </div>
    }
</div>
