<div
  class="fixed inset-0 z-[9999] flex bg-slate-950/95 p-3 backdrop-blur-md md:p-6"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title"
  (click)="close()"
>
  <div class="mx-auto flex h-full w-full max-w-7xl min-h-0 flex-col" (click)="$event.stopPropagation()">
    <header class="mb-3 flex shrink-0 items-center justify-between gap-4 text-white">
      <div class="min-w-0">
        <h2 class="truncate text-base font-semibold md:text-lg">{{ title }}</h2>
        <p class="mt-1 text-xs text-white/60">{{ selectedIndex + 1 }} / {{ images.length }}</p>
      </div>
      <button
        type="button"
        class="grid h-11 w-11 shrink-0 place-items-center rounded-full border border-white/25 bg-white/10 text-2xl transition hover:bg-white hover:text-slate-950 focus:outline-none focus:ring-2 focus:ring-white"
        [attr.aria-label]="'close' | translate"
        [title]="'close' | translate"
        (click)="close()"
      >
        <i class="mdi mdi-close"></i>
      </button>
    </header>

    <div class="relative flex min-h-0 flex-1 items-center justify-center overflow-hidden rounded-2xl bg-black/35">
      <img [src]="currentImage" [alt]="title" class="max-h-full max-w-full object-contain" />

      @if (images.length > 1) {
        <button
          type="button"
          class="absolute start-3 top-1/2 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full border border-white/30 bg-slate-950/60 text-3xl text-white shadow-lg backdrop-blur-sm transition hover:bg-primary focus:outline-none focus:ring-2 focus:ring-white md:start-5"
          [attr.aria-label]="'previous' | translate"
          [title]="'previous' | translate"
          (click)="previousImage()"
        >
          <i class="mdi mdi-chevron-left rtl:rotate-180"></i>
        </button>
        <button
          type="button"
          class="absolute end-3 top-1/2 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full border border-white/30 bg-slate-950/60 text-3xl text-white shadow-lg backdrop-blur-sm transition hover:bg-primary focus:outline-none focus:ring-2 focus:ring-white md:end-5"
          [attr.aria-label]="'next' | translate"
          [title]="'next' | translate"
          (click)="nextImage()"
        >
          <i class="mdi mdi-chevron-right rtl:rotate-180"></i>
        </button>
      }
    </div>

    @if (images.length > 1) {
      <div class="mt-3 flex shrink-0 justify-center gap-2 overflow-x-auto pb-1">
        @for (image of images; track $index; let imageIndex = $index) {
          <button
            type="button"
            class="shrink-0 overflow-hidden rounded-lg border-2 transition"
            [class.border-primary]="imageIndex === selectedIndex"
            [class.border-transparent]="imageIndex !== selectedIndex"
            (click)="selectImage(imageIndex)"
          >
            <img [src]="image" [alt]="title" class="h-16 w-24 object-cover md:h-20 md:w-28" />
          </button>
        }
      </div>
    }
  </div>
</div>
