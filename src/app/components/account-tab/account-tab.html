<div class="relative md:-mt-48 -mt-32">
    <div class="p-6 rounded-md shadow dark:shadow-gray-800 bg-white dark:bg-slate-900">
        <div class="profile-pic text-center mb-5">
            <input id="pro-img" name="profile-image" type="file" class="hidden" (change)="loadFile($event)" />
            <div>
                <div class="relative h-28 w-28 mx-auto">
                    <img [src]="imageSrc" class="rounded-full shadow dark:shadow-gray-800 ring-4 ring-slate-50 dark:ring-slate-800" id="profile-image" alt="">
                    <label class="absolute inset-0 cursor-pointer" for="pro-img"></label>
                </div>

                <div class="mt-4">
                    <h5 class="text-lg font-semibold">user name</h5>
                    <p class="text-slate-400">user&#64;hotmail.com</p>
                </div>
            </div>
        </div>
