<app-home-navbar />
<main class="container py-16 md:py-24">
  <a routerLink="/blogs" class="inline-flex items-center text-sm font-semibold text-primary"><i class="mdi mdi-arrow-left me-1"></i>Back to blogs</a>
  @if (isLoading) { <div class="mt-8 h-96 animate-pulse rounded-2xl bg-slate-100"></div> }
  @else if (errorMessage) { <p class="mt-8 rounded-xl bg-rose-50 p-4 text-rose-700">{{ errorMessage }}</p> }
  @else if (blog) { <article class="mx-auto mt-8 max-w-4xl"><p class="text-sm font-medium text-primary">{{ blog.publishedAt | date:'longDate' }}</p><h1 class="mt-3 text-3xl font-semibold leading-tight md:text-5xl" [dir]="isArabic ? 'rtl' : 'ltr'">{{ title }}</h1>
    @if (blog.images?.length) { <div class="mt-8 grid gap-4" [class.md:grid-cols-2]="blog.images.length > 1">@for (item of blog.images; track item.id) { <img [src]="image(item)" [alt]="title" class="w-full rounded-2xl object-cover" /> }</div> }
    <div class="mt-8 whitespace-pre-line text-lg leading-8 text-slate-700" [dir]="isArabic ? 'rtl' : 'ltr'">{{ content }}</div>
  </article> }
</main>
<app-footer-one />
