<div>
    <app-home-navbar />
<app-breadcrumbs />
    <section class="relative lg:pb-24 pb-16 md:mt-[84px] mt-[70px]">
        <div class="container relative">
            <div class="relative overflow-hidden md:rounded-md shadow dark:shadow-gray-800 h-52 bg-center bg-no-repeat bg-cover" [style.background-image]="'url(' + bg + ')'"></div>
        </div>

        <div class="container relative md:mt-24 mt-16">
            <div class="md:flex">
                <div class="lg:w-1/4 md:w-1/3 md:px-3">
                    <app-account-tab />
                </div>

                <div class="lg:w-3/4 md:w-2/3 md:px-3 mt-6 md:mt-0">
                    <div class="p-6 rounded-md shadow dark:shadow-gray-800 bg-white ">
                        <h5 class="text-lg font-semibold mb-4">Personal Detail :</h5>
                        <form>
                            <div class="grid lg:grid-cols-2 grid-cols-1 gap-5">
                                @for (item of details; track $index) {
                                    <div>
                                        <label class="form-label font-medium">{{ item.name }}<span class="text-primary-600">{{ item.name2 }}</span></label>
                                        <div class="form-icon relative mt-2">
                                            <i [attr.data-feather]="item.icon" class="w-4 h-4 absolute top-3 start-4"></i>
                                            <input type="text" class="ps-12 w-full py-2 px-3 h-10 bg-transparent   rounded outline-none border border-gray-100 dark:border-gray-800 focus:ring-0" [placeholder]="item.placeholder" name="name" required="">
                                        </div>
                                    </div>
                                }
                            </div>

                            <div class="grid grid-cols-1">
                                <div class="mt-5">
                                    <label class="form-label font-medium">Description : </label>
                                    <div class="form-icon relative mt-2">
                                        <i data-feather="message-circle" class="w-4 h-4 absolute top-3 start-4"></i>
                                        <textarea name="comments" id="comments" class="ps-11 w-full py-2 px-3 h-28 bg-transparent   rounded outline-none border border-gray-100 dark:border-gray-800 focus:ring-0" placeholder="Message :"></textarea>
                                    </div>
                                </div>
                            </div>

                            <input type="submit" id="submit" name="send" class="py-2 px-5 inline-block font-semibold tracking-wide align-middle duration-500 text-base text-center bg-primary text-white rounded-md mt-5" value="Save Changes">
                        </form>
                    </div>

                    <div class="p-6 rounded-md shadow dark:shadow-gray-800 bg-white  mt-6">
                        <div class="grid lg:grid-cols-2 grid-cols-1 gap-5">
                            <div>
                                <h5 class="text-lg font-semibold mb-4">Contact Info :</h5>

                                <form>
                                    <div class="grid grid-cols-1 gap-5">
                                        @for (item of details2; track $index) {
                                            <div>
                                                <label class="form-label font-medium">{{ item.name }}</label>
                                                <div class="form-icon relative mt-2">
                                                    <i [attr.data-feather]="item.icon" class="w-4 h-4 absolute top-3 start-4"></i>
                                                    <input name="number" type="number" class="ps-12 w-full py-2 px-3 h-10 bg-transparent   rounded outline-none border border-gray-100 dark:border-gray-800 focus:ring-0" [placeholder]="item.placeholder">
                                                </div>
                                            </div>
                                        }
                                    </div>

                                    <button class="py-2 px-5 inline-block font-semibold tracking-wide align-middle duration-500 text-base text-center bg-primary text-white rounded-md mt-5">Add</button>
                                </form>
                            </div>

                            <div>
                                <h5 class="text-lg font-semibold mb-4">Change password :</h5>
                                <form>
                                    <div class="grid grid-cols-1 gap-5">
                                        @for (item of details3; track $index) {
                                            <div>
                                                <label class="form-label font-medium">{{ item.name }}</label>
                                                <div class="form-icon relative mt-2">
                                                    <i [attr.data-feather]="item.icon" class="w-4 h-4 absolute top-3 start-4"></i>
                                                    <input [type]="passwordVisibility[$index] ? 'text' : 'password'" class="ps-12 pe-12 w-full py-2 h-10 bg-transparent   rounded outline-none border border-gray-100 dark:border-gray-800 focus:border-primary focus:ring-2 focus:ring-primary/20" [placeholder]="item.placeholder" required>
                                                    <button type="button" (click)="togglePasswordVisibility($index)" class="absolute end-1 top-1/2 z-10 grid size-9 -translate-y-1/2 place-items-center rounded-md text-slate-400 transition hover:bg-slate-100 hover:text-primary dark:hover:bg-slate-800" [attr.aria-label]="(passwordVisibility[$index] ? 'hidePassword' : 'showPassword') | translate" [attr.aria-pressed]="passwordVisibility[$index]"><i class="mdi text-xl" [class.mdi-eye-off-outline]="passwordVisibility[$index]" [class.mdi-eye-outline]="!passwordVisibility[$index]" aria-hidden="true"></i></button>
                                                </div>
                                            </div>
                                        }
                                    </div>

                                    <button class="py-2 px-5 inline-block font-semibold tracking-wide align-middle duration-500 text-base text-center bg-primary text-white rounded-md mt-5">Save password</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="p-6 rounded-md shadow dark:shadow-gray-800 bg-white  mt-6">
                        <h5 class="text-lg font-semibold mb-5 text-primary-600">Delete Account :</h5>

                        <p class="text-slate-400 mb-4">Do you want to delete the account? Please press below "Delete" button</p>

                        <a href="javascript:void(0)" class="py-2 px-5 inline-block font-semibold tracking-wide align-middle duration-500 text-base text-center bg-primary-600 text-white rounded-md">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<app-footer-one />
