<section class="min-h-screen bg-slate-50 px-4 text-slate-800">
  <div class="mx-auto max-w-7xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <header class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
      <div><p class="text-sm font-semibold uppercase tracking-[0.3em] text-primary">{{ 'admin' | translate }}</p><h1 class="mt-2 text-3xl font-semibold">{{ 'quotations' | translate }}</h1><p class="mt-2 text-sm text-slate-500">{{ 'manageQuotationDetails' | translate }}</p></div>
      <div class="flex gap-3">
        <a routerLink="/configurations" class="rounded-full border border-slate-300 px-4 py-2 text-sm font-medium">{{ 'backToDashboard' | translate }}</a>
        @if (showForm) {
          <button type="button" class="inline-flex h-10 items-center gap-2 rounded-full border border-slate-300 px-4 text-sm font-semibold text-slate-600 transition hover:border-rose-300 hover:bg-rose-50 hover:text-rose-600" [attr.title]="'hideAddQuotation' | translate" (click)="toggleForm()"><i class="mdi mdi-close"></i>{{ 'cancel' | translate }}</button>
        } @else {
          <button type="button" class="inline-flex h-10 items-center gap-2 rounded-full bg-primary px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-primary/90" [attr.title]="'showAddQuotation' | translate" (click)="openCreateForm()"><i class="mdi mdi-plus"></i>{{ 'addQuotation' | translate }}</button>
        }
        @if (!showForm) {
          <button type="button" class="grid h-10 w-10 place-items-center rounded-full border border-rose-200 bg-rose-50 text-xl text-rose-600 transition hover:bg-rose-600 hover:text-white" [attr.title]="(viewMode === 'table' ? 'switchToGrid' : 'switchToTable') | translate" (click)="viewMode = viewMode === 'table' ? 'grid' : 'table'"><i class="mdi" [class.mdi-view-grid-outline]="viewMode === 'table'" [class.mdi-table]="viewMode === 'grid'"></i></button>
        }
      </div>
    </header>
    <div class="grid grid-cols-1 gap-6">
      @if (showForm) {
        <app-quotations-from-card [selectedQuotation]="selectedQuotation" (quotationSaved)="handleQuotationSaved()" (editCancelled)="clearSelectedQuotation()" />
      } @else {
        <app-configurations-quotations-list [viewMode]="viewMode" [refreshToken]="refreshToken" (editRequested)="selectQuotationForEdit($event)" />
      }
    </div>
  </div>
</section>
