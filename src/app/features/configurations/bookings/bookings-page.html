<section class="min-h-screen bg-slate-50 px-4 text-slate-800">
  <div class="mx-auto max-w-7xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <header class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
      <div><p class="text-sm font-semibold uppercase tracking-[0.3em] text-primary">{{ 'admin' | translate }}</p><h1 class="mt-2 text-3xl font-semibold">{{ 'bookings' | translate }}</h1><p class="mt-2 text-sm text-slate-500">{{ 'manageBookings' | translate }}</p></div>
      <div class="flex gap-3">
        
        <button type="button" class="grid h-10 w-10 place-items-center rounded-full border border-rose-200 bg-rose-50 text-xl text-rose-600 transition hover:bg-rose-600 hover:text-white" [attr.title]="(viewMode === 'table' ? 'switchToGrid' : 'switchToTable') | translate" (click)="viewMode = viewMode === 'table' ? 'grid' : 'table'"><i class="mdi" [class.mdi-view-grid-outline]="viewMode === 'table'" [class.mdi-table]="viewMode === 'grid'"></i></button>
      </div>
    </header>
    <div class="grid grid-cols-1 gap-6">
      <app-configurations-bookings-list [viewMode]="viewMode" [refreshToken]="refreshToken" (editRequested)="selectBookingForEdit($event)" />
    </div>
  </div>
</section>

@if (selectedBooking) {
  <div class="fixed inset-0 z-[9999] grid place-items-center overflow-y-auto bg-slate-950/60 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" [attr.aria-label]="'assignBookingAgent' | translate">
    <button type="button" class="absolute inset-0 cursor-default" [attr.aria-label]="'close' | translate" (click)="clearSelectedBooking()"></button>
    <div class="relative z-10 w-full max-w-2xl"><app-bookings-from-card [selectedBooking]="selectedBooking" (bookingSaved)="handleBookingSaved()" (editCancelled)="clearSelectedBooking()" /></div>
  </div>
}
