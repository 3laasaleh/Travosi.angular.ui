<div class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
  <div class="mb-4 flex items-center justify-between"><h2 class="text-xl font-semibold">{{ selectedBlog ? 'Edit blog' : 'Add blog' }}</h2><button type="button" class="text-sm text-slate-500" (click)="cancelled.emit()">Cancel</button></div>
  @if (errorMessage) { <p class="mb-4 rounded-xl bg-rose-50 p-3 text-sm text-rose-700">{{ errorMessage }}</p> }
  <form class="space-y-4" [formGroup]="form" (ngSubmit)="save()">
    <div class="grid gap-4 md:grid-cols-2"><label class="text-sm font-medium">English title<input formControlName="titleEng" maxlength="200" class="mt-1 w-full rounded-xl border p-2" /></label><label class="text-sm font-medium">Arabic title<input formControlName="titleAr" maxlength="200" dir="rtl" class="mt-1 w-full rounded-xl border p-2" /></label></div>
    <div class="grid gap-4 md:grid-cols-2"><label class="text-sm font-medium">English summary<textarea formControlName="summaryEng" maxlength="500" rows="2" class="mt-1 w-full rounded-xl border p-2"></textarea></label><label class="text-sm font-medium">Arabic summary<textarea formControlName="summaryAr" maxlength="500" rows="2" dir="rtl" class="mt-1 w-full rounded-xl border p-2"></textarea></label></div>
    <div class="grid gap-4 md:grid-cols-2"><label class="text-sm font-medium">English content<textarea formControlName="contentEng" maxlength="15000" rows="8" class="mt-1 w-full rounded-xl border p-2"></textarea></label><label class="text-sm font-medium">Arabic content<textarea formControlName="contentAr" maxlength="15000" rows="8" dir="rtl" class="mt-1 w-full rounded-xl border p-2"></textarea></label></div>
    <div>
      <label for="blog-publish-date" class="block text-sm font-medium">Publish date</label>
      <app-date-picker formControlName="publishedAt" id="blog-publish-date" placeholder="Select a publish date" ariaLabel="Publish date" class="mt-1 block max-w-sm" inputClass="rounded-xl border border-slate-300 bg-white px-3 py-2.5 pe-11 shadow-sm" />
      <p class="mt-1 text-xs text-slate-500">Choose the day this blog should appear on the website.</p>
    </div>
    <div><label for="blog-images" class="inline-flex cursor-pointer rounded-full border border-primary px-4 py-2 text-sm font-semibold text-primary">Add images ({{ images.length }}/{{ maxImages }})</label><input id="blog-images" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp" multiple (change)="onFiles($event)" />
      @if (images.length) { <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">@for (image of images; track image.url; let index = $index) { <div class="relative overflow-hidden rounded-xl"><img [src]="image.url" alt="Blog image" class="aspect-[3/2] w-full object-cover" /><button type="button" class="absolute right-1 top-1 grid h-7 w-7 place-items-center rounded-full bg-black/70 text-white" (click)="removeImage(index)"><i class="mdi mdi-close"></i></button></div> }</div> }
    </div>
    <button type="submit" [disabled]="isSaving || form.invalid" class="rounded-full bg-primary px-5 py-2 text-sm font-semibold text-white disabled:opacity-60">{{ isSaving ? 'Saving…' : (selectedBlog ? 'Update blog' : 'Create blog') }}</button>
  </form>
</div>
