<section class="relative flex h-screen items-center justify-center bg-slate-50 ">
    <div class="container relative">
        <div class="flex justify-center">
            <div class="lg:w-2/5">
                <div class="relative overflow-hidden rounded-md bg-white shadow  dark:shadow-gray-800">
                    <div class="bg-emerald-600 px-6 py-12 text-center">
                        <i class="mdi mdi-check-circle text-6xl text-white"></i>
                        <h5 class="mt-2 text-xl font-semibold uppercase tracking-wide text-white">{{ 'success' | translate }}</h5>
                    </div>

                    <div class="px-6 py-12 text-center">
                        <p class="text-xl font-semibold text-black ">{{ title | translate }}</p>
                        <p class="mt-4 text-slate-400">{{ message | translate }}</p>
                        <div class="mt-6">
                            <a [routerLink]="redirectLink" class="inline-block rounded-md bg-primary px-5 py-2 text-center text-base tracking-wide text-white duration-500">{{ buttonText | translate }}</a>
                        </div>
                    </div>

                    <div class="border-t border-gray-100 p-6 text-center dark:border-gray-700">
                        <p class="mb-0 text-slate-400">&copy; {{ year }} Sea World Holidays. {{ 'allRightsReserved' | translate }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
