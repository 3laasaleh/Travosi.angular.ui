@if (isCustomerPage()) {
  <a
    [href]="whatsappUrl"
    target="_blank"
    rel="noopener noreferrer"
    data-exit-bypass
    class="group fixed bottom-5 right-5 z-[80] grid h-14 w-14 place-items-center rounded-full bg-[#25d366] text-3xl text-white shadow-[0_12px_30px_rgba(37,211,102,.42)] transition duration-300 hover:-translate-y-1 hover:scale-105 hover:bg-[#1ebe5d] focus:outline-none focus:ring-4 focus:ring-[#25d366]/30 md:bottom-7 md:right-7 md:h-16 md:w-16"
    [attr.aria-label]="'whatsappFloatingLabel' | translate"
    [title]="'whatsappFloatingLabel' | translate"
  >
    <span class="absolute inset-0 -z-10 animate-ping rounded-full bg-[#25d366]/25"></span>
    <i class="mdi mdi-whatsapp" aria-hidden="true"></i>
    <span class="pointer-events-none absolute right-full mr-3 hidden whitespace-nowrap rounded-xl bg-slate-950 px-3 py-2 text-xs font-semibold text-white opacity-0 shadow-lg transition group-hover:opacity-100 md:block">
      {{ 'whatsappFloatingLabel' | translate }}
    </span>
  </a>
}

@if (modalOpen()) {
  <div class="fixed inset-0 z-[100] grid place-items-center overflow-y-auto bg-slate-950/70 p-4 backdrop-blur-sm" role="presentation" (click)="closeModal()">
    <section
      role="dialog"
      aria-modal="true"
      aria-labelledby="exit-dialog-title"
      class="relative w-full max-w-lg overflow-hidden rounded-3xl border border-white/20 bg-white shadow-2xl dark:border-slate-700 "
      (click)="$event.stopPropagation()"
    >
      <div class="h-2 bg-gradient-to-r from-primary via-cyan-400 to-amber-300"></div>
      <button
        type="button"
        class="absolute end-4 top-5 grid h-9 w-9 place-items-center rounded-full text-xl text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-white"
        [attr.aria-label]="'close' | translate"
        (click)="closeModal()"
      >
        <i class="mdi mdi-close"></i>
      </button>

      <div class="p-6 text-center sm:p-8">
        <img src="assets/images/main-logo.png" alt="Sea World Holidays" class="mx-auto h-16 w-auto" />
        <div class="mx-auto mt-5 grid h-14 w-14 place-items-center rounded-full bg-amber-50 text-3xl text-amber-500 dark:bg-amber-400/10">
          <i class="mdi mdi-hand-wave-outline"></i>
        </div>
        <h2 id="exit-dialog-title" class="mt-4 text-2xl font-bold text-slate-900 ">{{ 'leaveSiteTitle' | translate }}</h2>
        <p class="mx-auto mt-3 max-w-md leading-7 text-slate-600 ">{{ 'leaveSiteMessage' | translate }}</p>

        <div class="mt-6 rounded-2xl bg-slate-50 p-4 /70">
          <p class="text-sm font-medium text-slate-500 ">{{ 'bookingContactPrompt' | translate }}</p>
          <a [href]="phoneUrl" data-exit-bypass class="mt-2 inline-flex items-center gap-2 text-xl font-bold text-primary transition hover:underline" dir="ltr">
            <i class="mdi mdi-phone"></i>{{ phoneDisplay }}
          </a>
        </div>

        <div class="mt-5 flex flex-wrap justify-center gap-3">
          <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" data-exit-bypass class="inline-flex items-center gap-2 rounded-full bg-[#25d366] px-4 py-2.5 font-semibold text-white transition hover:-translate-y-0.5 hover:shadow-lg">
            <i class="mdi mdi-whatsapp text-xl"></i> WhatsApp
          </a>
          <a [href]="instagramUrl" target="_blank" rel="noopener noreferrer" data-exit-bypass class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-fuchsia-600 to-rose-500 px-4 py-2.5 font-semibold text-white transition hover:-translate-y-0.5 hover:shadow-lg">
            <i class="mdi mdi-instagram text-xl"></i> Instagram
          </a>
          <a [href]="facebookUrl" target="_blank" rel="noopener noreferrer" data-exit-bypass class="inline-flex items-center gap-2 rounded-full bg-[#1877f2] px-4 py-2.5 font-semibold text-white transition hover:-translate-y-0.5 hover:shadow-lg">
            <i class="mdi mdi-facebook text-xl"></i> Facebook
          </a>
        </div>

        <p class="mt-6 text-sm font-medium text-slate-500 ">{{ 'thanksForVisiting' | translate }}</p>

        <div class="mt-6 flex flex-col-reverse justify-center gap-3 sm:flex-row">
          <button type="button" class="rounded-full border border-slate-300 px-5 py-2.5 font-semibold text-slate-700 transition hover:border-primary hover:text-primary dark:border-slate-700 " (click)="closeModal()">
            {{ 'continueBrowsing' | translate }}
          </button>
        </div>
      </div>
    </section>
  </div>
}
