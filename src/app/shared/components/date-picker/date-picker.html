<div class="relative">
  <input
    #picker="mwlFlatpickr"
    type="text"
    mwlFlatpickr
    [ngModel]="selectedDate"
    [ngModelOptions]="{ standalone: true }"
    [convertModelValue]="true"
    [allowInput]="true"
    [disableMobile]="true"
    [enableTime]="includeTime"
    [time24hr]="true"
    [dateFormat]="includeTime ? 'Y-m-d H:i' : 'Y-m-d'"
    [locale]="pickerLocale"
    [minDate]="minDate ?? ''"
    [maxDate]="maxDate ?? ''"
    [disabled]="isDisabled"
    [attr.id]="id || null"
    [attr.aria-label]="ariaLabel || placeholder || 'Date'"
    [placeholder]="placeholder"
    (ngModelChange)="selectDate($event)"
    (flatpickrReady)="configureCalendar($event)"
    (blur)="markTouched()"
    class="w-full pe-11 outline-none transition"
    [ngClass]="inputClass" />
  <button
    type="button"
    class="absolute end-2 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-xl text-slate-400 transition hover:bg-primary/10 hover:text-primary disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="isDisabled"
    [attr.aria-label]="ariaLabel || placeholder || 'Date'"
    (click)="openCalendar($event, picker)">
    <i class="mdi text-lg" [ngClass]="icon"></i>
  </button>
</div>
