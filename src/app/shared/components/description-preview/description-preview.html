@if (expanded || !hasMore) {
  <app-description-links [text]="text" />
} @else {
  {{ previewText }}
}
@if (hasMore) {
  <button type="button" class="ms-1 inline font-semibold text-primary underline decoration-primary/40 underline-offset-2 hover:text-primary-700"
    (click)="toggle($event)">
    {{ (expanded ? 'showLess' : 'showMore') | translate }}
  </button>
}
