@if (compact) {
<a [routerLink]="routeLink" class="group flex gap-3 rounded-xl p-1 transition hover:bg-slate-50">
  <img [src]="imageUrl" [alt]="imageAlt" loading="lazy" (error)="onImageError($event)"
    class="h-14 w-16 shrink-0 rounded-lg object-cover" />
  <span class="min-w-0">
    <span class="line-clamp-2 text-sm font-semibold transition group-hover:text-primary">{{ tour?.title }}</span>
    <span class="mt-1 block text-xs font-semibold text-primary">{{ formattedPrice }}</span>
  </span>
</a>
} @else {
<a [routerLink]="routeLink"
  class="group flex h-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:border-primary/40 hover:shadow-lg focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/25 dark:border-slate-800"
  [attr.aria-label]="tour?.title">
  <article class="flex w-full flex-col">
    <div class="relative overflow-hidden">
      <img [src]="imageUrl" [alt]="imageAlt" loading="lazy" (error)="onImageError($event)"
        class="aspect-[4/3] w-full object-cover transition duration-500 group-hover:scale-105" />
 
      @if (hasDiscount) {
      <span class="absolute end-3 top-3 rounded-full bg-emerald-500 px-3 py-1 text-xs font-bold text-white shadow">-{{
        discountPercentage }}%</span>
      }
    </div>
    <div class="flex flex-1 flex-col p-4">
      <h3 class="line-clamp-2 text-lg font-semibold transition group-hover:text-primary">{{ tour?.title }}</h3>
      @if ( tour?.description) {
      <p class="mt-2 line-clamp-2 text-sm leading-6 text-slate-500">{{ tour?.description }}</p>
      }
      <div class="mt-auto pt-4">
        <div class="flex items-center justify-between gap-3 border-t border-slate-100 pt-3 dark:border-slate-800">
          <div class="flex flex-col ">
            @if (hasDiscount) {
            <span class="ms-2 text-xs text-slate-400 line-through">{{ formattedOriginalPrice }}</span>
            }
            <strong class="text-lg text-primary">{{ formattedPrice }}</strong>

          </div>
          <span
            class="inline-flex  items-center justify-center rounded-lg bg-primary-600 px-4 py-1 text-center text-sm font-semibold text-white duration-300 group-hover:bg-primary-700">
            {{ 'bookNow'|translate }}
          </span>
        </div>
      </div>
    </div>
  </article>
</a>
}
