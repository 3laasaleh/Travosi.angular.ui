<div class="container relative md:mt-24 mt-16">
    <div class="grid grid-cols-1 pb-6 text-center">
        <h3 class="mb-6 md:text-3xl text-2xl md:leading-normal leading-normal font-semibold">Travel Blogs</h3>
        <p class="text-slate-400 max-w-xl mx-auto"></p>
    </div>

    <div class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 mt-6 gap-6">
        @for (item of blogData; track $index) {
            <div class="group relative overflow-hidden">
                <div class="relative overflow-hidden rounded-md shadow dark:shadow-gray-800">
                    <img [src]="item.image" class="group-hover:scale-110 group-hover:rotate-3 duration-500" alt="">
                    <div class="absolute top-0 start-0 p-4 opacity-0 group-hover:opacity-100 duration-500">
                        <span class="bg-primary text-white text-[12px] px-2.5 py-1 font-medium rounded-md h-5">{{ item.status }}</span>
                    </div>
                </div>

                <div class="mt-6">
                    <div class="flex mb-4">
                        <span class="flex items-center text-slate-400 text-sm"><i data-feather="clock" class="size-4 text-slate-900 dark:text-white me-1.5"></i>5 min read</span>
                        <span class="text-slate-400 text-sm ms-3"> <a href="javascript:void(0)" class="text-slate-900 dark:text-white hover:text-primary dark:hover:text-primary font-medium">Sea World</a></span>
                    </div>

                    <a routerLink="/blog-detail" class="text-lg font-medium hover:text-primary duration-500 ease-in-out">{{ item.title }}</a>
                    <p class="text-slate-400 mt-2">{{ item.desc }}</p>

                    <div class="mt-3">
                        <a routerLink="/blog-detail" class="hover:text-primary inline-flex items-center">Read More <i data-feather="chevron-right" class="size-4 ms-1"></i></a>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
