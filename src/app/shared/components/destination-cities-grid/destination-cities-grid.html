<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
  @for (city of cities; track city.id) {
    <a [routerLink]="destinationRouteName && city.routeName ? ['/destinations', destinationRouteName, 'cities', city.routeName] : ['/destinations']" class="group overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:border-primary/40 hover:shadow-lg">
      <img [src]="cityImage(city)" [alt]="cityName(city)" (error)="onCityImageError($event)" class="aspect-[4/3] w-full object-cover transition duration-500 group-hover:scale-105" />
      <div class="p-4">
        <h3 class="font-semibold group-hover:text-primary">{{ cityName(city) }}</h3>
        @if (city.description) {
          <p class="mt-2 text-sm leading-6 text-slate-500"><app-description-preview [text]="city.description" /></p>
        }
      </div>
    </a>
  }
</div>
