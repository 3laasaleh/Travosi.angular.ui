@if (isVisible()) {
  <nav
    [attr.aria-label]="'breadcrumbNavigation' | translate"
    [class]="bare() ? '' : (onDark() ? 'relative py-3' : 'border-b border-slate-100 bg-slate-50/70 py-3')">
    <div [class]="bare() ? '' : 'container relative'">
      <ol class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
        @for (item of items(); track item.path; let last = $last; let first = $first) {
          <li class="flex items-center gap-x-2">
            @if (last) {
              <span
                aria-current="page"
                class="max-w-[18rem] truncate font-semibold"
                [class]="onDark() ? 'text-white' : 'text-slate-900'"
                [title]="item.name">
                {{ item.name }}
              </span>
            } @else {
              <a
                [routerLink]="item.path"
                class="inline-flex items-center gap-1 transition hover:text-primary"
                [class]="onDark() ? 'text-slate-200' : 'text-slate-500'">
                @if (first) {
                  <i class="mdi mdi-home-outline text-base" aria-hidden="true"></i>
                }
                {{ item.name }}
              </a>
              <i
                class="mdi mdi-chevron-right text-base rtl:rotate-180"
                [class]="onDark() ? 'text-slate-400' : 'text-slate-300'"
                aria-hidden="true"></i>
            }
          </li>
        }
      </ol>
    </div>
  </nav>
}
