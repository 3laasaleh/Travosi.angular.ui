<div class="container relative md:mt-24 mt-16">
    <div class="grid grid-cols-1 pb-6 text-center">
        <h3 class="mb-6 md:text-3xl text-2xl md:leading-normal leading-normal font-semibold">Frequently Asked Questions</h3>
        <p class="text-slate-400 max-w-xl mx-auto"></p>
    </div>

    <div class="relative grid md:grid-cols-12 grid-cols-1 items-center mt-6 gap-6">
        <div class="md:col-span-6">
            <img src="assets/images/bg/6.jpg" class="w-full h-[540px] object-cover rounded-md shadow dark:shadow-gray-800" alt="">
        </div>

        <div class="md:col-span-6">
            <div id="accordion-collapse" data-accordion="collapse">
                @for (item of datas; track item.id) {
                    <div class="relative shadow dark:shadow-gray-800 rounded-md overflow-hidden mt-4">
                        <h2 class="text-base font-semibold" id="accordion-collapse-heading-1">
                            <button type="button" (click)="handleclick(item.id)" [class.bg-gray-50]="item.id === activeIndex" [class.dark:bg-slate-800]="item.id === activeIndex" [class.text-primary]="item.id === activeIndex" class="flex justify-between items-center p-5 w-full font-medium text-start">
                                <span>{{ item.title }}</span>
                                <svg data-accordion-icon [class.rotate-180]="item.id === activeIndex" class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                </svg>
                            </button>
                        </h2>
                        <div id="accordion-collapse-body-1" [class.hidden]="item.id !== activeIndex" aria-labelledby="accordion-collapse-heading-1">
                            <div class="p-5">
                                <p class="text-slate-400 dark:text-gray-400">{{ item.desc }}</p>
                            </div>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
