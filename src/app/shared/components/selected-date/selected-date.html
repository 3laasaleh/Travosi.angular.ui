<form class="p-6 bg-white  rounded-xl shadow dark:shadow-gray-700">
    <div class="registration-form text-dark text-start">
        <div class="grid lg:grid-cols-5 md:grid-cols-2 grid-cols-1 gap-4">
            <div>
                <label class="form-label font-medium text-slate-900 ">Search:</label>
                <div class="relative mt-2">
                    <i data-feather="search" class="size-[18px] absolute top-[10px] start-3"></i>
                    <input name="name" type="text" id="job-keyword" class="w-full py-2 px-3 ps-10 h-10 bg-transparent   rounded-md outline-none border border-gray-100 dark:border-gray-800 focus:ring-0" placeholder="Search">
                </div>
            </div>

            <div>
                <label class="form-label font-medium text-slate-900 ">Select Your Date:</label>
                <div class="relative mt-2">
                    <app-date-picker
                        [(ngModel)]="date"
                        name="date"
                        placeholder="Select Your Date"
                        ariaLabel="Select Your Date"
                        class="block"
                        [inputClass]="'h-10 w-full rounded-md border border-gray-100 bg-transparent py-2 ps-3 outline-none focus:ring-0 dark:border-gray-800  '" />
                </div>
            </div>

            <div>
                <label class="form-label font-medium text-slate-900 ">Select Your Date:</label>
                <div class="relative mt-2">
                    <app-date-picker
                        [(ngModel)]="date2"
                        name="date2"
                        placeholder="Select Your Date"
                        ariaLabel="Select Your Date"
                        class="block"
                        [inputClass]="'h-10 w-full rounded-md border border-gray-100 bg-transparent py-2 ps-3 outline-none focus:ring-0 dark:border-gray-800  '" />
                </div>
            </div>

            <div>
                <label class="form-label font-medium text-slate-900 ">No. of person:</label>
                <div class="relative mt-2">
                    <i data-feather="users" class="size-[18px] absolute top-[10px] start-3"></i>
                    <select class="form-select w-full py-2 px-3 ps-10 h-10 bg-transparent   rounded-md outline-none border border-gray-100 dark:border-gray-800 focus:ring-0">
                        <option disabled selected>No. of person</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>
            </div>

            <div class="lg:mt-[35px]">
                <input type="submit" id="search-buy" name="search" class="py-1 px-5 h-10 inline-block tracking-wide align-middle duration-500 text-base text-center bg-primary text-white rounded-md w-full cursor-pointer" value="Search">
            </div>
        </div>
    </div>
</form>
