<div class="flex justify-center" [class.mt-6]="!compact">
  <nav aria-label="Pagination">
    <ul class="inline-flex items-center -space-x-px">
      <li>
        <button
          type="button"
          aria-label="Previous page"
          class="inline-flex size-[40px] items-center justify-center rounded-s-3xl border border-gray-100 bg-white text-slate-400 enabled:hover:border-primary enabled:hover:bg-primary enabled:hover:text-white dark:border-gray-800  dark:enabled:hover:border-primary dark:enabled:hover:bg-primary disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="normalizedCurrentPage === 1"
          (click)="goToPage(normalizedCurrentPage - 1)"
        >
          <i class="mdi mdi-chevron-left text-xl rtl:rotate-180" aria-hidden="true"></i>
        </button>
      </li>

      @for (page of visiblePages; track $index) {
        <li>
          @if (page === 'ellipsis') {
            <span
              class="inline-flex size-[40px] items-center justify-center border border-gray-100 bg-white text-slate-400 dark:border-gray-800 "
              aria-hidden="true"
            >…</span>
          } @else {
            <button
              type="button"
              class="inline-flex size-[40px] items-center justify-center border"
              [class.z-10]="page === normalizedCurrentPage"
              [class.border-primary]="page === normalizedCurrentPage"
              [class.bg-primary]="page === normalizedCurrentPage"
              [class.text-white]="page === normalizedCurrentPage"
              [class.border-gray-100]="page !== normalizedCurrentPage"
              [class.bg-white]="page !== normalizedCurrentPage"
              [class.text-slate-400]="page !== normalizedCurrentPage"
              [class.enabled:hover:border-primary]="page !== normalizedCurrentPage"
              [class.enabled:hover:bg-primary]="page !== normalizedCurrentPage"
              [class.enabled:hover:text-white]="page !== normalizedCurrentPage"
              [class.dark:border-gray-800]="page !== normalizedCurrentPage"
              [class.]="page !== normalizedCurrentPage"
              [class.dark:enabled:hover:border-primary]="page !== normalizedCurrentPage"
              [class.dark:enabled:hover:bg-primary]="page !== normalizedCurrentPage"
              [attr.aria-current]="page === normalizedCurrentPage ? 'page' : null"
              [attr.aria-label]="'Page ' + page"
              (click)="goToPage(page)"
            >{{ page }}</button>
          }
        </li>
      }

      <li>
        <button
          type="button"
          aria-label="Next page"
          class="inline-flex size-[40px] items-center justify-center rounded-e-3xl border border-gray-100 bg-white text-slate-400 enabled:hover:border-primary enabled:hover:bg-primary enabled:hover:text-white dark:border-gray-800  dark:enabled:hover:border-primary dark:enabled:hover:bg-primary disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="normalizedCurrentPage === normalizedTotalPages"
          (click)="goToPage(normalizedCurrentPage + 1)"
        >
          <i class="mdi mdi-chevron-right text-xl rtl:rotate-180" aria-hidden="true"></i>
        </button>
      </li>
    </ul>
  </nav>
</div>
