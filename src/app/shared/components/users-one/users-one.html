<div class="container relative md:mt-24 mt-16">
    <div class="grid grid-cols-1 pb-6 text-center">
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.22em] text-primary">{{ 'ourTravelPromise' | translate }}</p>
        <h3 class="mb-4 md:text-3xl text-2xl md:leading-normal leading-normal font-semibold">{{ 'whyTravelersChooseUs' | translate }}</h3>
        <p class="text-slate-400 max-w-xl mx-auto">{{ 'whyTravelersChooseUsDescription' | translate }}</p>
    </div>

    <div class="grid grid-cols-1 mt-6">
        <div class="tiny-three-item">
            @for (item of travelPromises; track item.title) {
                <div class="tiny-slide text-center">
                    <div class="cursor-e-resize">
                        <div class="content relative m-2 min-h-64 rounded-3xl border border-slate-200 bg-white p-7 shadow-sm dark:border-slate-800 dark:bg-slate-900">
                            <span class="mx-auto grid size-16 place-items-center rounded-2xl bg-primary/10 text-3xl text-primary"><i class="mdi" [class]="'mdi ' + item.icon"></i></span>
                            <h4 class="mt-5 text-xl font-semibold">{{ item.title | translate }}</h4>
                            <p class="mt-3 leading-7 text-slate-400">{{ item.description | translate }}</p>
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
