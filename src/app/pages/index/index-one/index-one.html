<app-tagline-one />
<app-navbar-one menuLight="nav-light" tagLine="tagline-height" [navLight]="true" searchMenu="text-white" />
<section class="relative md:pt-72 md:pb-60 py-36 table w-full items-center bg-top bg-no-repeat bg-cover" [style.background-image]="'url(' + bg + ')'">
    <div class="absolute inset-0 bg-slate-900/40"></div>
    <div class="container relative">
        <div class="grid md:grid-cols-12 grid-cols-1 items-center mt-10 gap-[30px]">
            <div class="lg:col-span-8 md:col-span-7 md:order-1 order-2">
                <h5 class="text-3xl !font-dancing text-white">Beauty of Discover</h5>
                <h4 class="font-bold text-white lg:leading-normal leading-normal text-4xl lg:text-6xl mb-6 mt-5">Let's Leave The Road, <br/> And Take The Travosy</h4>
                <p class="text-white/70 text-xl max-w-xl">Planning for a trip? We will organize your trip with the best places and within best budget!</p>
            </div>

            <div class="lg:col-span-4 md:col-span-5 md:text-center md:order-2 order-1">
                <a (click)="toggle()" data-type="youtube" data-id="S_CGed6E610" class="cursor-pointer lightbox lg:h-24 h-20 lg:w-24 w-20 rounded-full shadow-lg dark:shadow-gray-800 inline-flex items-center justify-center bg-white hover:bg-primary text-primary hover:text-white duration-500 ease-in-out mx-auto">
                    <i class="mdi mdi-play inline-flex items-center justify-center text-3xl"></i>
                </a>
            </div>
        </div>
    </div>
</section>
<div class="container relative -mt-16 z-1">
    <div class="grid grid-cols-1">
        <app-selected-date />
    </div>
</div>

<div [class.fixed]="isActive" [class.hidden]="!isActive" class="bg-slate-900/[0.9] top-0 left-0 bottom-0 w-[100%] h-[100%] z-999">
    <div class="h-[100%] flex items-center justify-center">
        <iframe src="https://www.youtube.com/embed/S_CGed6E610" width="700" height="500" frameborder="0"></iframe>
    </div><button class="text-slate-400 absolute top-[20px] right-[20px]">
        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="size-5" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg" (click)="toggle()">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>
<section class="relative md:py-24 py-16 overflow-hidden">
    <app-destinations-slider [Destinations]="true" />
    <div class="md:mt-24 mt-16">
        <app-tour-packages-slider />
    </div>
    <app-agency-one />
    <app-users-one />
    <app-blogs-one />
</section>
<app-footer-one />
<app-switcher-one [switcherBack]="true" />
