<app-tagline-one />
<app-navbar-one menuLight="nav-light" tagLine="tagline-height" [navLight]="true" searchMenu="text-white" />
<section class="swiper-slider-hero relative block h-screen" id="home">
    <div class="swiper-container absolute end-0 top-0 w-full h-full">
        <div class="swiper h-full">
            <div class="swiper-wrapper">
                <div class="swiper-slide flex items-center overflow-hidden">
                    <div class="slide-inner absolute end-0 top-0 w-full h-full slide-bg-image flex items-center bg-center" [style.background-image]="'url(' + bg2 + ')'">
                        <div class="absolute inset-0 bg-slate-900/70"></div>
                        <div class="container relative">
                            <div class="grid grid-cols-1">
                                <div class="text-center">
                                    <img [src]="map" class="mx-auto w-[300px]" alt="">
                                    <h1 class="font-bold text-white lg:leading-normal leading-normal text-4xl lg:text-6xl mb-6 mt-5">Find Your Best <br/> Travels Package</h1>
                                    <p class="text-white/70 text-xl max-w-xl mx-auto">Planning for a trip? We will organize your trip with the best places and within best budget!</p>

                                    <div class="mt-6">
                                        <a href="javascript:void(0)" class="py-2 px-5 inline-block tracking-wide align-middle duration-500 text-base text-center bg-primary text-white rounded-md">See More</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide flex items-center overflow-hidden">
                    <div class="slide-inner absolute end-0 top-0 w-full h-full slide-bg-image flex items-center bg-center" [style.background-image]="'url(' + bg3 + ')'">
                        <div class="absolute inset-0 bg-slate-900/70"></div>
                        <div class="container relative">
                            <div class="grid grid-cols-1">
                                <div class="text-center">
                                    <img [src]="map" class="mx-auto w-[300px]" alt="">
                                    <h1 class="font-bold text-white lg:leading-normal leading-normal text-4xl lg:text-6xl mb-6 mt-5">Find Next Best <br/> Place To Visit</h1>
                                    <p class="text-white/70 text-xl max-w-xl mx-auto">Planning for a trip? We will organize your trip with the best places and within best budget!</p>

                                    <div class="mt-6">
                                        <a href="javascript:void(0)" class="py-2 px-5 inline-block tracking-wide align-middle duration-500 text-base text-center bg-primary text-white rounded-md">See More</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="swiper-pagination"></div>
    </div>
</section>

<section class="relative py-16 bg-gray-50 dark:bg-slate-800">
    <div class="container relative">
        <div class="grid grid-cols-1">
            <app-selected-date />
        </div>
    </div>
</section>

<app-agency-one />
<app-tour-packages />
<app-users-one />
<app-blogs-one />
<section class="relative md:mt-24 mt-16 overflow-hidden">
    <app-footer-one />
    <app-switcher-one [switcherBack]="true" />
</section>
