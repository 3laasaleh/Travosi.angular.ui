<app-navbar-one menuLight="nav-light" [navLight]="true" searchMenu="text-white" />
<section class="relative table w-full items-center py-36 bg-top bg-no-repeat bg-cover" [style.background-image]="'url(' + bg + ')'">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-900/60 via-slate-900/80 to-slate-900"></div>
    <div class="container relative">
        <div class="grid grid-cols-1 pb-8 text-center mt-10">
            <h3 class="text-4xl leading-normal tracking-wider font-semibold text-white">Tour Packages</h3>
        </div>
    </div>

    <div class="absolute text-center z-10 bottom-5 start-0 end-0 mx-3">
        <ul class="tracking-[0.5px] mb-0 inline-block">
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white/50 hover:text-white">
                <a routerLink="/">See World</a>
            </li>
            <li class="inline-block text-base text-white/50 mx-0.5 ltr:rotate-0 rtl:rotate-180"><i class="mdi mdi-chevron-right"></i></li>
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white" aria-current="page">Tour</li>
        </ul>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <div class="container relative">
        <div class="grid md:grid-cols-12 grid-cols-1 gap-6">
            <div class="lg:col-span-4 md:col-span-4">
                <app-price-filter />
            </div>

            <div class="lg:col-span-8 md:col-span-8">
                <div class="grid grid-cols-1 gap-6">
                    @for (item of packageData; track $index) {
                        <div class="group rounded-md shadow dark:shadow-gray-700">
                            <div class="md:flex md:items-center">
                                <div class="relative overflow-hidden md:shrink-0 md:rounded-md rounded-t-md shadow dark:shadow-gray-700 md:m-3 mx-3 mt-3">
                                    <img [src]="item.image" class="h-full w-full object-cover md:w-48 md:h-56 scale-125 group-hover:scale-100 duration-500" alt="">
                                    <div class="absolute top-0 start-0 p-4">
                                        @if (item.discount) {
                                            <span class="bg-primary text-white text-[12px] px-2.5 py-1 font-medium rounded-md h-5">{{ item.discount }}</span>
                                        }
                                    </div>
                                    <div class="absolute top-0 end-0 p-4">
                                        <a href="#" class="size-8 inline-flex justify-center items-center bg-white dark:bg-slate-900 shadow dark:shadow-gray-800 rounded-full text-slate-100 dark:text-slate-700 focus:text-primary dark:focus:text-primary hover:text-primary dark:hover:text-primary"><i class="mdi mdi-heart text-[20px] align-middle"></i></a>
                                    </div>
                                </div>

                                <div class="p-4 w-full">
                                    <p class="flex items-center text-slate-400 font-medium mb-2"><i data-feather="map-pin" class="text-primary size-4 me-1"></i> {{ item.country }}</p>
                                    <a routerLink="/tour-detail-one" class="text-lg font-medium hover:text-primary duration-500 ease-in-out">{{ item.city }}</a>

                                    <div class="flex items-center mt-2">
                                        <span class="text-slate-400">Rating:</span>
                                        <ul class="text-lg font-medium text-amber-400 list-none ms-2">
                                            <li class="inline"><i class="mdi mdi-star align-middle"></i></li>
                                            <li class="inline"><i class="mdi mdi-star align-middle"></i></li>
                                            <li class="inline"><i class="mdi mdi-star align-middle"></i></li>
                                            <li class="inline"><i class="mdi mdi-star align-middle"></i></li>
                                            <li class="inline"><i class="mdi mdi-star align-middle"></i></li>
                                            <li class="inline text-black dark:text-white text-sm">5.0(30)</li>
                                        </ul>
                                    </div>

                                    <div class="mt-4 pt-4 flex justify-between items-center border-t border-slate-100 dark:border-gray-800">
                                        <h5 class="text-lg font-medium text-primary">$ 58 / Day</h5>
                                        <a href="javascript:void(0)" class="text-slate-400 hover:text-primary">Explore Now <i class="mdi mdi-arrow-right"></i></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    }
                </div>
                <app-pagination-one />
            </div>
        </div>
    </div>
</section>
<app-footer-one />
<app-switcher-one [switcherBack]="true" />
