<app-home-navbar />
<section class="relative table w-full items-center py-36 bg-top bg-no-repeat bg-cover" [style.background-image]="'url(' + bg + ')'">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-900/60 via-slate-900/80 to-slate-900"></div>
    <div class="container relative">
        <div class="grid grid-cols-1 pb-8 text-center mt-10">
            <h3 class="text-3xl leading-normal tracking-wider font-semibold text-white">New Zealand’s South Island brims with majestic</h3>
        </div>
    </div>

    <div class="absolute text-center z-10 bottom-5 start-0 end-0 mx-3">
        <ul class="tracking-[0.5px] mb-0 inline-block">
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white/50 hover:text-white">
                <a routerLink="/">See World</a>
            </li>
            <li class="inline-block text-base text-white/50 mx-0.5 ltr:rotate-0 rtl:rotate-180"><i class="mdi mdi-chevron-right"></i></li>
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white" aria-current="page">Tour</li>
        </ul>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <div class="container relative">
        <div class="grid md:grid-cols-12 grid-cols-1 gap-6">
            <div class="lg:col-span-8 md:col-span-7">
                <div class="grid grid-cols-12 gap-4">
                    <div class="md:col-span-8 col-span-7">
                        <div class="group relative overflow-hidden rounded shadow dark:shadow-gray-800">
                            <img [src]="images[0]" class="w-full lg:h-60 md:h-44 h-48 object-cover" alt="">
                            <div class="absolute inset-0 group-hover:bg-slate-900/70 duration-500 ease-in-out"></div>
                            <div class="absolute top-1/2 -translate-y-1/2 start-0 end-0 text-center opacity-0 group-hover:opacity-100 duration-500">
                                <a (click)="showMultiple(0)" class="inline-flex cursor-pointer justify-center items-center size-9 bg-primary text-white rounded-full lightbox">
                                    <i data-feather="camera" class="size-4 align-middle"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-4 col-span-5">
                        <div class="group relative overflow-hidden rounded shadow dark:shadow-gray-800">
                            <img [src]="images[1]" class="w-full lg:h-60 md:h-44 h-48 object-cover" alt="">
                            <div class="absolute inset-0 group-hover:bg-slate-900/70 duration-500 ease-in-out"></div>
                            <div class="absolute top-1/2 -translate-y-1/2 start-0 end-0 text-center opacity-0 group-hover:opacity-100 duration-500">
                                <a (click)="showMultiple(1)" class="inline-flex cursor-pointer justify-center items-center size-9 bg-primary text-white rounded-full lightbox">
                                    <i data-feather="camera" class="size-4 align-middle"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-4 col-span-5">
                        <div class="group relative overflow-hidden rounded shadow dark:shadow-gray-800">
                            <img [src]="images[2]" class="w-full lg:h-60 md:h-44 h-48 object-cover" alt="">
                            <div class="absolute inset-0 group-hover:bg-slate-900/70 duration-500 ease-in-out"></div>
                            <div class="absolute top-1/2 -translate-y-1/2 start-0 end-0 text-center opacity-0 group-hover:opacity-100 duration-500">
                                <a (click)="showMultiple(2)" class="inline-flex cursor-pointer justify-center items-center size-9 bg-primary text-white rounded-full lightbox">
                                    <i data-feather="camera" class="size-4 align-middle"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-8 col-span-7 mb-4">
                        <div class="group relative overflow-hidden rounded shadow dark:shadow-gray-800">
                            <img [src]="images[3]" class="w-full lg:h-60 md:h-44 h-48 object-cover" alt="">
                            <div class="absolute inset-0 group-hover:bg-slate-900/70 duration-500 ease-in-out"></div>
                            <div class="absolute top-1/2 -translate-y-1/2 start-0 end-0 text-center opacity-0 group-hover:opacity-100 duration-500">
                                <a (click)="showMultiple(3)" class="inline-flex cursor-pointer justify-center items-center size-9 bg-primary text-white rounded-full lightbox"><i data-feather="camera" class="size-4 align-middle"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
                <app-tour-detail />
            </div>
            <app-tour-sidebar class="contents" />
        </div>
    </div>
</section>

@if (visible) {
    <div class="fixed inset-0 z-999 bg-slate-900/90 flex items-center justify-center" (click)="onHide()">
        <button class="text-slate-400 absolute top-[20px] right-[20px] text-2xl" (click)="onHide()"><i class="mdi mdi-close"></i></button>
        <button class="text-white absolute start-5 top-1/2 -translate-y-1/2 text-3xl" (click)="prev($event)"><i class="mdi mdi-chevron-left"></i></button>
        <img [src]="images[index]" class="max-h-[90vh] max-w-[90vw] object-contain" alt="" (click)="$event.stopPropagation()">
        <button class="text-white absolute end-5 top-1/2 -translate-y-1/2 text-3xl" (click)="next($event)"><i class="mdi mdi-chevron-right"></i></button>
    </div>
}
<app-footer-one />
<app-switcher-one [switcherBack]="true" />
