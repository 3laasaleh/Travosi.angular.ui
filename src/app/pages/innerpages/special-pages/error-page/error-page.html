<div>
    <section class="relative bg-primary/5">
        <div class="container-fluid relative">
            <div class="grid grid-cols-1">
                <div class="flex flex-col min-h-screen justify-center md:px-10  px-4">
                    <div class="text-center">
                        <a routerLink="/"><img [src]="logo" class="mx-auto" alt=""></a>
                    </div>
                    <div class="title-heading text-center my-auto">
                        <img [src]="maintenance" class="mx-auto w-72" alt="">
                        <h1 class="mt-8 mb-6 md:text-5xl text-3xl font-bold">Page Not Found?</h1>
                        <p class="text-slate-400">Whoops, this is embarassing. <br> Looks like the page you were looking for wasn't found.</p>

                        <div class="mt-4">
                            <a routerLink="/" class="py-2 px-5 inline-block font-semibold tracking-wide border align-middle duration-500 text-base text-center bg-primary hover:bg-primary-600 border-primary hover:border-primary-600 text-white rounded-md">Back to Home</a>
                        </div>
                    </div>
                    <div class="text-center">
                        <p class="mb-0 text-slate-400">© {{ year }} See World. Developed<i class="mdi mdi-heart text-primary-600"></i> by <a href="https://shreethemes.in/" target="_blank" class="text-reset">Shreethemes</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="fixed bottom-3 end-3">
        <a routerLink="/" class="back-button size-9 inline-flex items-center justify-center tracking-wide border align-middle duration-500 text-base text-center bg-primary hover:bg-primary-600 border-primary hover:border-primary-600 text-white rounded-full"><i data-feather="arrow-left" class="h-4 w-4"></i></a>
    </div>
</div>
