<app-navbar-one menuLight="nav-light" [navLight]="true" searchMenu="text-white" />
<section class="relative table w-full items-center py-36 bg-top bg-no-repeat bg-cover" [style.background-image]="'url(' + bg + ')'">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-900/60 via-slate-900/80 to-slate-900"></div>
    <div class="container relative">
        <div class="grid grid-cols-1 pb-8 text-center mt-10">
            <h3 class="text-4xl leading-normal tracking-wider font-semibold text-white">Blogs / News</h3>
        </div>
    </div>

    <div class="absolute text-center z-10 bottom-5 start-0 end-0 mx-3">
        <ul class="tracking-[0.5px] mb-0 inline-block">
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white/50 hover:text-white">
                <a routerLink="/">See World</a>
            </li>
            <li class="inline-block text-base text-white/50 mx-0.5 ltr:rotate-0 rtl:rotate-180"><i class="mdi mdi-chevron-right"></i></li>
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white" aria-current="page">Blogs</li>
        </ul>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <div class="container">
        <div class="grid md:grid-cols-12 grid-cols-1 gap-6">
            <div class="lg:col-span-8 md:col-span-6">
                <div class="grid grid-cols-1 gap-6">
                    @for (item of blogData; track $index) {
                        <div class="group relative overflow-hidden">
                            <div class="relative overflow-hidden rounded-md shadow dark:shadow-gray-800">
                                <img [src]="item.image" class="group-hover:scale-110 group-hover:rotate-3 duration-500" alt="">
                                <div class="absolute top-0 start-0 p-4 opacity-0 group-hover:opacity-100 duration-500">
                                    <span class="bg-primary text-white text-[12px] px-2.5 py-1 font-medium rounded-md h-5">{{ item.status }}</span>
                                </div>
                            </div>

                            <div class="mt-6">
                                <div class="flex mb-4">
                                    <span class="flex items-center text-slate-400 text-sm"><i data-feather="clock" class="size-4 text-slate-900 dark:text-white me-1.5"></i>5 min read</span>
                                    <span class="text-slate-400 text-sm ms-3">by <a href="javascript:void(0)" class="text-slate-900 dark:text-white hover:text-primary dark:hover:text-primary font-medium">See World</a></span>
                                </div>

                                <a routerLink="/blog-detail" class="text-lg font-medium hover:text-primary duration-500 ease-in-out">{{ item.title }}</a>
                                <p class="text-slate-400 mt-2">{{ item.desc }}</p>

                                <div class="mt-3">
                                    <a routerLink="/blog-detail" class="hover:text-primary inline-flex items-center">Read More <i data-feather="chevron-right" class="size-4 ms-1"></i></a>
                                </div>
                            </div>
                        </div>
                    }
                </div>
                <app-pagination-one />
            </div>

            <div class="lg:col-span-4 md:col-span-6">
                <div class="sticky top-20">
                    <h5 class="text-lg font-medium bg-gray-50 dark:bg-slate-800 shadow dark:shadow-gray-800 rounded-md p-2 text-center">Author</h5>
                    <div class="text-center mt-8">
                        <img [src]="client" class="h-20 w-20 mx-auto rounded-full shadow mb-4" alt="">
                        <a href="javascript:void(0)" class="text-lg font-medium hover:text-primary transition-all duration-500 ease-in-out h5">Cristina Romsey</a>
                        <p class="text-slate-400">Content Writer</p>
                    </div>

                    <h5 class="text-lg font-medium bg-gray-50 dark:bg-slate-800 shadow dark:shadow-gray-800 rounded-md p-2 text-center mt-8">Social sites</h5>
                    <ul class="list-none text-center mt-8 space-x-0.5">
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="facebook" class="size-4"></i></a></li>
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="instagram" class="size-4"></i></a></li>
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="twitter" class="size-4"></i></a></li>
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="linkedin" class="size-4"></i></a></li>
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="github" class="size-4"></i></a></li>
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="youtube" class="size-4"></i></a></li>
                        <li class="inline"><a href="javascript:void(0)" class="size-8 inline-flex items-center justify-center tracking-wide align-middle text-base border border-gray-100 dark:border-gray-800 rounded-md text-slate-400 hover:border-primary hover:text-white hover:bg-primary"><i data-feather="gitlab" class="size-4"></i></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
<app-footer-one />
<app-switcher-one [switcherBack]="true" />
