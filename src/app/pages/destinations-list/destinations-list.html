<app-navbar-one menuLight="nav-light" [navLight]="true" searchMenu="text-white" />
<section class="relative table w-full items-center py-36 bg-top bg-no-repeat bg-cover"
    [style.background-image]="'url(' + bg + ')'">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-900/60 via-slate-900/80 to-slate-900"></div>
    <div class="container relative">
        <div class="grid grid-cols-1 pb-8 text-center mt-10">
            <h3 class="text-4xl leading-normal tracking-wider font-semibold text-white">Destinations</h3>
        </div>
    </div>

    <div class="absolute text-center z-10 bottom-5 start-0 end-0 mx-3">
        <ul class="tracking-[0.5px] mb-0 inline-block">
            <li
                class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white/50 hover:text-white">
                <a routerLink="/">See World</a>
            </li>
            <li class="inline-block text-base text-white/50 mx-0.5 ltr:rotate-0 rtl:rotate-180"><i
                    class="mdi mdi-chevron-right"></i></li>
            <li class="inline-block uppercase text-[13px] font-bold duration-500 ease-in-out text-white"
                aria-current="page">Destinations</li>
        </ul>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <div class="container relative">

        <div class="grid lg:grid-cols-3 md:grid-cols-2 sm:grid-cols-2 grid-cols-1 relative mt-6 gap-6">
            @for (item of destinations; track $index) {
            <div class="group relative overflow-hidden rounded-md shadow dark:shadow-gray-800">
                <img [src]="item.image" class="scale-125 group-hover:scale-100 duration-500" alt="">
                <div
                    class="absolute inset-0 bg-gradient-to-b to-slate-900 from-transparent opacity-0 group-hover:opacity-100 duration-500">
                </div>
                <div class="absolute p-4 bottom-0 start-0">
                    <a href="javascript:void(0)"
                        class="text-lg font-medium text-white hover:text-primary duration-500 ease-in-out">{{ item.place
                        }}</a>
                    <p class="text-white/70 group-hover:text-white text-sm duration-500">{{ item.hotel }}</p>
                </div>
            </div>
            }
        </div>

        <app-pagination-one />
    </div>
</section>
<app-footer-one />
<app-switcher-one [switcherBack]="true" />
